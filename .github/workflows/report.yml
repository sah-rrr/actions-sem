https://github:
  com/k1mo-rubik/actions-sem:
    git:
name: Create Report Artifact

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Run summary script          # ← 1. запуск скрипта
        run: bash scripts/create-summary.sh

      - name: Upload artifact            # ← 2. сохранение артефакта
        uses: actions/upload-artifact@v4
        with:
          name: seminar-summary
          path: build/reports/seminar-summary.txt
